# agent-guardrails: generated by agent-guardrails.sh — Gemini CLI policy, admin tier.
# Deploy to /etc/gemini-cli/policies/ — root-owned and not group- or
# world-writable, or Gemini ignores the whole directory.
# allow=495 ask=272 deny=76 — priorities deny 300 > ask 200 > allow 100.

[[rule]]
toolName = "run_shell_command"
commandPrefix = [
  "sudo",
  "su",
  "doas",
  "npm publish",
  "yarn publish",
  "pnpm publish",
  "mvn deploy",
  "twine upload",
