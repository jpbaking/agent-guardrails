  "gh variable set",
  "gh repo delete",
  "gh auth token",
  "gh auth logout",
  "gh ssh-key add",
  "gh gpg-key add",
  "gh ssh-key delete",
  "gh gpg-key delete",
  "gh release delete",
  "gh variable delete",
  "gh ruleset delete",
  "cargo login",
  "cargo owner",
  "cargo yank",
  "docker push",
  "docker login",
  "podman push",
  "podman login",
  "buildah push",
  "skopeo copy",
  "helm push",
  "helm repo add",
  "pvecm delnode",
  "pvecm add",
  "pveum user delete",
  "pveum role delete",
  "pveum acl delete",
  "virsh pool-delete",
  "VBoxManage unregistervm --delete",
  "gem push",
  "gem signin",
  "gem owner",
  "gem yank",
  "dotnet nuget push",
  "nuget push",
  "nuget setapikey",
